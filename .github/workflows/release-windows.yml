name: Build Windows template release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout MG templates
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: |
          npm run typecheck
          npm test

      - name: Install NSIS
        run: choco install nsis --no-progress --yes

      - name: Build template installer
        run: npm run dist:win

      - name: Write checksum
        shell: pwsh
        run: |
          $artifact = Get-ChildItem release/Story-Claw-MG-Template-Pack-Setup-*.exe | Select-Object -First 1
          $hash = (Get-FileHash -LiteralPath $artifact.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($artifact.Name)" | Set-Content release/SHA256SUMS.txt -Encoding ascii

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: story-claw-mg-template-pack-windows
          path: |
            release/Story-Claw-MG-Template-Pack-Setup-*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Story-Claw-MG-Template-Pack-Setup-*.exe
            release/SHA256SUMS.txt
