<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1680"><defs><filter id="shadow" x="-10%" y="-30%" width="130%" height="160%"><feDropShadow dx="2" dy="3" stdDeviation="1" flood-color="#172c4f" flood-opacity=".9"/></filter></defs><rect width="1400" height="1680" fill="white"/><text x="80" y="115" font-family="Arial, Microsoft YaHei" font-size="27" fill="#8d7c81" font-style="italic" letter-spacing="4" >RESEARCH NOTES / INFERENCE SYSTEMS</text><path d="M80 135 H1360" stroke="#9a9a9a" stroke-width="2"/><text x="80" y="175" font-family="Arial, Microsoft YaHei" font-size="22" fill="#8c4c55" font-style="italic" letter-spacing="3" >COMPUTER SCIENCE</text><rect x="80" y="200" width="1060" height="75" fill="#315fba"/><text x="125" y="255" font-family="Arial, Microsoft YaHei" font-size="55" fill="white" font-weight="bold" font-style="italic" filter="url(#shadow)">模型开源与规模化推理服务</text><text x="80" y="315" font-family="Arial, Microsoft YaHei" font-size="24" fill="#222" font-weight="bold" font-style="italic" >DeepSeek / DeepInfer · Open-source inference engineering</text><rect x="80" y="350" width="1060" height="360" fill="#315fba"/><text x="90" y="385" font-family="Arial, Microsoft YaHei" font-size="28" fill="white" font-style="italic" font-weight="600" filter="url(#shadow)">大模型开源，也有类似的问题。拿到模型之后，你可以设法把它运行起来；但要让</text><text x="90" y="430" font-family="Arial, Microsoft YaHei" font-size="28" fill="white" font-style="italic" font-weight="600" filter="url(#shadow)">大量用户同时使用，还要回答得快、成本够低，就进入了另一道工程难题。服务器</text><text x="90" y="475" font-family="Arial, Microsoft YaHei" font-size="28" fill="white" font-style="italic" font-weight="600" filter="url(#shadow)">那边，却要先处理你发来的问题和前面的对话，再一步步生成回答。每个人输入的</text><text x="90" y="520" font-family="Arial, Microsoft YaHei" font-size="28" fill="white" font-style="italic" font-weight="600" filter="url(#shadow)">内容不同，回答的长度也不同。怎么把这些任务安排到硬件上，哪些需要一起处理，</text><text x="90" y="565" font-family="Arial, Microsoft YaHei" font-size="28" fill="white" font-style="italic" font-weight="600" filter="url(#shadow)">哪些要先做，怎么算用的时间最少，开始影响整个服务的速度和成本。所以，你觉</text><text x="90" y="610" font-family="Arial, Microsoft YaHei" font-size="28" fill="white" font-style="italic" font-weight="600" filter="url(#shadow)">得AI在思考的那几秒，背后除了数学，还有大量任务在排队。这时候你可能会想：</text><text x="90" y="655" font-family="Arial, Microsoft YaHei" font-size="28" fill="white" font-style="italic" font-weight="600" filter="url(#shadow)">排队还不简单，多买几张显卡啊。行，钱花出去了。接下来才是麻烦的地方：买来</text><text x="90" y="700" font-family="Arial, Microsoft YaHei" font-size="28" fill="white" font-style="italic" font-weight="600" filter="url(#shadow)">的算力，怎么让它们真正干上活？</text><text x="80" y="770" font-family="Arial, Microsoft YaHei" font-size="27" fill="#8c4c55" font-weight="bold" >INTRODUCTION</text><text x="1180" y="205" font-family="Arial, Microsoft YaHei" font-size="20" fill="#202020"  >Illustration</text><text x="1180" y="235" font-family="Arial, Microsoft YaHei" font-size="20" fill="#202020"  >2024 / demo</text><text x="1180" y="280" font-family="Arial, Microsoft YaHei" font-size="18" fill="#202020"  >Layout preview</text><text x="1180" y="310" font-family="Arial, Microsoft YaHei" font-size="18" fill="#202020"  >Not an official</text><text x="1180" y="340" font-family="Arial, Microsoft YaHei" font-size="18" fill="#202020"  >research paper</text><text x="1180" y="370" font-family="Arial, Microsoft YaHei" font-size="18" fill="#202020"  >Template test</text><text x="1180" y="400" font-family="Arial, Microsoft YaHei" font-size="18" fill="#202020"  >Source content:</text><text x="1180" y="430" font-family="Arial, Microsoft YaHei" font-size="18" fill="#202020"  >user narration</text><text x="80" y="815" font-family="Arial, Microsoft YaHei" font-size="20" fill="#202020"  >Inference systems coordinate requests at scale.</text><text x="650" y="815" font-family="Arial, Microsoft YaHei" font-size="20" fill="#202020"  >Inference systems coordinate requests at scale.</text><text x="80" y="844" font-family="Arial, Mic